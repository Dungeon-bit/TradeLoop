<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — TradeLoop</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
  <div class="wrap navbar">
    <div style="display: flex; align-items: center; gap: 2rem;">
      <a class="brand" href="/" style="display: flex; align-items: center;"><img src="/css/tradeloop-64px.svg" alt="TradeLoop" style="height: 32px;"></a>
    </div>
  </div>
</header>
<main class="wrap-sm" style="padding-top: 4rem;">
  <div class="auth-container">
    <h1 class="auth-title">Log in</h1>
    <p id="err" class="err" hidden></p>
    <form id="form">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" class="form-control" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" class="form-control" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn mt-4">SIGN IN</button>
    </form>
    <p class="text-center mt-4 mb-2" style="font-size: 0.9rem;">
      Don't have an account? <a href="/register.html" style="font-weight: 600; color: var(--primary);">Create one</a>
    </p>
  </div>
</main>
<script src="/js/api.js"></script>
<script>
  fetch("/api/me", { credentials: "same-origin" }).then(function (r) {
    if (r.ok) window.location.href = "/home.html";
  });
  document.getElementById("form").addEventListener("submit", async function (e) {
    e.preventDefault();
    const err = document.getElementById("err");
    err.hidden = true;
    const fd = new FormData(e.target);
    try {
      await apiPost("/api/login", {
        username: fd.get("username"),
        password: fd.get("password"),
      });
      window.location.href = "/home.html";
    } catch (ex) {
      err.textContent = ex.message || "Login failed";
      err.hidden = false;
    }
  });
</script>
</body>
</html>
