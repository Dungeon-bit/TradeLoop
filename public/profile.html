<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile — TradeLoop</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <div class="wrap bar">
      <a href="/home.html" class="brand">TradeLoop</a>
      <nav>
        <a href="/home.html">Home</a>
        <a href="/sell.html">Sell</a>
        <a href="/profile.html">Profile</a>
        <span class="hi" id="who"></span>
        <a href="#" id="logout">Log out</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <h1 id="uname">…</h1>
    <h2>Items you listed</h2>
    <p id="err" class="err" hidden></p>
    <ul class="items" id="listed"></ul>
    <h2>Items you bought</h2>
    <ul class="items" id="bought"></ul>
  </main>
  <footer class="wrap small">No online payments — arrange offline (SRS).</footer>
  <script src="/js/require-login.js"></script>
  <script src="/js/api.js"></script>
  <script>
    (async function () {
      const err = document.getElementById("err");
      try {
        const data = await apiGet("/api/profile");
        document.getElementById("who").textContent = data.user.username;
        document.getElementById("uname").textContent = data.user.username;

        const listed = document.getElementById("listed");
        if (!data.listed.length) {
          listed.innerHTML = "<li class=\"small\">No listings.</li>";
        } else {
          data.listed.forEach(function (p) {
            const li = document.createElement("li");
            const a = document.createElement("a");
            a.href = "/product.html?id=" + p.id;
            a.textContent = p.name;
            li.appendChild(a);
            li.appendChild(
              document.createTextNode(" — " + (p.is_available ? "available" : "sold"))
            );
            listed.appendChild(li);
          });
        }

        const bought = document.getElementById("bought");
        if (!data.bought.length) {
          bought.innerHTML = "<li class=\"small\">No purchases.</li>";
        } else {
          data.bought.forEach(function (p) {
            const li = document.createElement("li");
            const a = document.createElement("a");
            a.href = "/product.html?id=" + p.id;
            a.textContent = p.name;
            li.appendChild(a);
            li.appendChild(document.createTextNode(" — from " + p.seller_username));
            bought.appendChild(li);
          });
        }
      } catch (e) {
        err.textContent = e.message || "Error";
        err.hidden = false;
      }

      document.getElementById("logout").addEventListener("click", async function (e) {
        e.preventDefault();
        await apiPost("/api/logout", {});
        window.location.href = "/login.html";
      });
    })();
  </script>
</body>
</html>
