<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sell — TradeLoop</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<header>
  <div class="wrap navbar">
    <div style="display: flex; align-items: center; gap: 2rem;">
      <a class="brand" href="/" style="display: flex; align-items: center;"><img src="/css/tradeloop-64px.svg" alt="TradeLoop" style="height: 32px;"></a>
      <nav>
        <a href="/home.html">Shop</a>
        <a href="/sell.html" style="border-bottom: 2px solid var(--primary); padding-bottom: 5px; color: var(--text-main);">Sell</a>
        <a href="/help.html">Help</a>
      </nav>
    </div>
    <div style="flex: 1; max-width: 400px; margin: 0 2rem;"></div>
    <nav>
      <a href="/profile.html">Profile</a>
      <span id="who" class="hi"></span>
    </nav>
  </div>
</header>
<main class="wrap-sm">
  <div class="auth-container mt-4" style="padding: 2.5rem;">
    <h1 class="auth-title" style="margin-bottom: 0.5rem; text-align: left;">Sell an item</h1>
    <p class="text-muted mb-4">List your item for others to discover.</p>
    <p id="err" class="err" hidden></p>
    <form id="form" enctype="multipart/form-data">
      <div class="form-group">
        <label>Primary Photo</label>
        <input class="form-control" name="image" type="file" accept="image/*" required>
      </div>
      <div class="form-group">
        <label>Name</label>
        <input class="form-control" name="name" required maxlength="200" placeholder="e.g. Nikon FE Film Camera">
      </div>
      <div class="form-group">
        <label>Category</label>
        <select class="form-control" name="category" id="category" required>
          <option value="" selected disabled>Select a category...</option>
        </select>
      </div>
      <div class="form-group">
        <label>Price (₹)</label>
        <input class="form-control" name="price" type="number" step="0.01" min="0.01" required placeholder="0.00">
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input class="form-control" name="phone" value="+91 " placeholder="e.g. +91 98765 43210">
      </div>
      <div class="form-group">
        <label>Address</label>
        <textarea class="form-control" name="address" rows="2" placeholder="Full address"></textarea>
      </div>
      <div class="form-group">
        <label>Location (Pin on map)</label>
        <div id="map" style="height: 250px; border-radius: 8px; border: 1px solid var(--border-color); z-index: 1;"></div>
        <input type="hidden" name="lat" id="lat">
        <input type="hidden" name="lng" id="lng">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea class="form-control" name="description" rows="4" placeholder="Condition, edition, pickup details..."></textarea>
      </div>
      <button type="submit" class="btn mt-3">LIST ITEM</button>
    </form>
  </div>
</main>
<footer style="margin-top: 4rem;">
  <div>TradeLoop © 2026</div>
  <div style="display: flex; gap: 1rem;">
    <a href="#">Help</a>
    <a href="#">Terms</a>
    <a href="#">Safety</a>
  </div>
</footer>
<script src="/js/require-login.js"></script>
<script src="/js/api.js"></script>
<script>
  (async function () {
    const err = document.getElementById("err");
    try {
      const me = await apiGet("/api/me");
      document.getElementById("who").textContent = me.user.username.charAt(0);
      const { categories } = await apiGet("/api/categories");
      const sel = document.getElementById("category");
      categories.forEach(function (c) {
        const o = document.createElement("option");
        o.value = c;
        o.textContent = c;
        sel.appendChild(o);
      });

      // Init Map
      const map = L.map('map').setView([31.9211, 77.1657], 8);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
      let marker;
      map.on('click', function(e) {
        if (marker) {
          marker.setLatLng(e.latlng);
        } else {
          marker = L.marker(e.latlng).addTo(map);
        }
        document.getElementById('lat').value = e.latlng.lat;
        document.getElementById('lng').value = e.latlng.lng;
      });
    } catch (e) {
      return;
    }

    document.getElementById("form").addEventListener("submit", async function (e) {
      e.preventDefault();
      err.hidden = true;
      const fd = new FormData(e.target);
      
      try {
        const res = await fetch("/api/products", {
          method: "POST",
          body: fd,
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to list item");
        
        window.location.href = "/product.html?id=" + data.id;
      } catch (ex) {
        err.textContent = ex.message || "Error";
        err.hidden = false;
      }
    });
  })();
</script>
</body>
</html>
