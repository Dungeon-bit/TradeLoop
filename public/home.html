<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TradeLoop</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
  <div class="wrap navbar">
    <div style="display: flex; align-items: center; gap: 2rem;">
      <a class="brand" href="/" style="display: flex; align-items: center;"><img src="/css/tradeloop-64px.svg" alt="TradeLoop" style="height: 32px;"></a>
      <nav>
        <a href="/home.html" style="border-bottom: 2px solid var(--primary); padding-bottom: 5px; color: var(--text-main);">Shop</a>
        <a href="/sell.html">Sell</a>
        <a href="/help.html">Help</a>
      </nav>
    </div>
    
    <div style="flex: 1; max-width: 400px; margin: 0 2rem;">
      <input type="text" class="form-control" placeholder="Search for vintage denim, tech, home..." id="nav-search" onkeydown="if(event.key==='Enter' && this.value.trim()!=='') window.location.href='/browse.html?q='+encodeURIComponent(this.value.trim());" style="border-radius: 9999px; background: #FAFAFA; border: 1px solid var(--border-color); font-size: 0.85rem; padding: 0.5rem 1rem;">
    </div>

    <nav>
      <a href="/profile.html">Profile</a>
      <span id="who" class="hi"></span>
    </nav>
  </div>
</header>
<main>
  <div class="wrap">
    <div class="category-icons">
      <a href="/browse.html?category=Books" class="cat-icon">
        <div class="cat-circle">📚</div>
        Books
      </a>
      <a href="/browse.html?category=Electronics" class="cat-icon">
        <div class="cat-circle">💻</div>
        Electronics
      </a>
      <a href="/browse.html?category=Essentials" class="cat-icon">
        <div class="cat-circle">🧴</div>
        Essentials
      </a>
      <a href="/browse.html?category=Others" class="cat-icon">
        <div class="cat-circle">⋯</div>
        Others
      </a>
    </div>

    <div class="minimal-banner">
      📍 Local Gems Near You
    </div>

    <div style="margin-top: 2rem;">
      <p id="err" class="err" hidden></p>
      <div id="list" class="grid"></div>
    </div>
  </div>
</main>
<footer>
  <div>TradeLoop © 2026</div>
  <div style="display: flex; gap: 1rem;">
    <a href="#">Help</a>
    <a href="#">Terms</a>
    <a href="#">Safety</a>
  </div>
</footer>
<script src="/js/require-login.js"></script>
<script src="/js/api.js"></script>
<script>
(async function () {
  const err = document.getElementById("err");

  // Helper function removed

  try {
    const me = await apiGet("/api/me");
    // Just initial since it's a minimal circle avatar style
    document.getElementById("who").textContent = me.user.username.charAt(0);

    const { products } = await apiGet("/api/products/recent");
    const list = document.getElementById("list");
    if (!products.length) {
      list.innerHTML = "<p>No items available right now.</p>";
      return;
    }

    products.forEach(function (p) {
      const div = document.createElement("div");
      div.className = "card";
      const imgSrc = p.image_url || 'https://dummyimage.com/400x300/EBEBEB/757575.jpg&text=No+Image';

      div.innerHTML = `
        <div class="card-img-wrapper" style="cursor: pointer;" onclick="window.location.href='/product.html?id=${p.id}'">
          <img class="card-img" src="${imgSrc}" alt="${p.name}">
        </div>
        <div class="card-body">
          <h3 class="card-title" style="margin-top: 0.5rem;"><a href="/product.html?id=${p.id}" style="color: inherit; text-decoration: none;">${p.name}</a></h3>
          <div class="card-price">₹${p.price.toFixed(2)}</div>
          <div class="seller-info">
            <div class="seller-avatar"></div>
            <span style="font-weight: 500;">${p.seller_username}</span>
          </div>
          <button type="button" class="btn mt-3 buy-btn" data-id="${p.id}" ${p.seller_username === document.getElementById('who').textContent ? 'disabled' : ''}>BUY NOW</button>
        </div>
      `;
      list.appendChild(div);
    });

    // Add listener for instant buy
    list.addEventListener("click", async function(e) {
      if (e.target.classList.contains("buy-btn")) {
        const btn = e.target;
        const id = btn.getAttribute("data-id");
        btn.disabled = true;
        btn.textContent = "Processing...";
        err.hidden = true;
        try {
          await apiPost("/api/products/" + id + "/buy", {});
          window.location.href = "/profile.html";
        } catch (ex) {
          err.textContent = ex.message || "Failed to buy";
          err.hidden = false;
          btn.disabled = false;
          btn.textContent = "BUY NOW";
        }
      }
    });
  } catch (e) {
    err.textContent = e.message || "Error loading data";
    err.hidden = false;
  }
})();
</script>
</body>
</html>
