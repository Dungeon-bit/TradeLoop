<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>
(async function () {
  const err = document.getElementById("err");

  try {
    const me = await apiGet("/api/me");

    // username fix
    document.getElementById("who").textContent = me.user.username;

    // categories
    const { categories } = await apiGet("/api/categories");
    const catUl = document.getElementById("cats");

    categories.forEach(function (c) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = "/browse.html?category=" + encodeURIComponent(c);
      a.textContent = c;
      li.appendChild(a);
      catUl.appendChild(li);
    });

    // products
    const { products } = await apiGet("/api/products/recent");
    const list = document.getElementById("list");

    if (!products.length) {
      list.innerHTML = "<p>No items available.</p>";
      return;
    }

    products.forEach(function (p) {
      const div = document.createElement("div");
      div.className = "col mb-5";

      div.innerHTML = `
        <div class="card h-100">
          <img class="card-img-top" src="https://dummyimage.com/450x300/dee2e6/6c757d.jpg" alt="">
          <div class="card-body p-4">
            <div class="text-center">
              <h5 class="fw-bolder">${p.name}</h5>
              <p class="text-muted">${p.category}</p>
              ₹${p.price.toFixed(2)}
            </div>
          </div>
          <div class="card-footer p-4 pt-0 border-top-0 bg-transparent text-center">
            <a href="/product.html?id=${p.id}" class="btn btn-outline-dark mt-auto">View</a>
          </div>
        </div>
      `;

      list.appendChild(div);
    });

  } catch (e) {
    err.textContent = e.message || "Error loading data";
    err.hidden = false;
  }
})();
</script>
